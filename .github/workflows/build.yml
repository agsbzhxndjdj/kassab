name: Build Kassab APK 🎯

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK 📱
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ جلب الكود
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Java 17
      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3️⃣ Flutter SDK
      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.0'
          cache: true

      # 4️⃣ تثبيت التبعيات
      - name: 📦 Get dependencies
        run: flutter pub get

      # 5️⃣ حذف مجلد أندرويد القديم
      - name: 🗑️ Remove outdated Android folder
        run: rm -rf android

      # 6️⃣ توليد مجلد أندرويد جديد
      - name: 🔄 Regenerate Android project
        run: flutter create --platforms android --org com.kassab .

      # ✅✅ الإصلاح الجديد ✅✅
      # 7️⃣ تحديث Kotlin و SDK versions لتوافق الحزم الحديثة
      - name: 🆙 Update Kotlin and SDK versions
        run: |
          # تحديث Kotlin في settings.gradle (الطريقة الجديدة)
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "2.0.21"/' android/settings.gradle
          
          # تحديث Kotlin في build.gradle (الطريقة القديمة)
          sed -i "s/ext.kotlin_version = '[0-9.]*'/ext.kotlin_version = '2.0.21'/" android/build.gradle 2>/dev/null || true
          
          # تحديث compileSdk و targetSdk إلى 34 (مطلوب من حزم حديثة)
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/' android/app/build.gradle
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/' android/app/build.gradle
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/' android/app/build.gradle
          sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/' android/app/build.gradle
          
          # تحديث minSdk إلى 21 (لتوافق أحدث الحزم)
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/' android/app/build.gradle
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/' android/app/build.gradle

      # 8️⃣ بناء APK نهائي
      - name: 🏗️ Build Release APK
        run: flutter build apk --release --split-per-abi

      # 9️⃣ بناء App Bundle (لـ Play Store)
      - name: 📦 Build App Bundle (AAB)
        run: flutter build appbundle --release

      # 🔟 رفع ملفات APK
      - name: 📤 Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: kassab-apks
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 30
          if-no-files-found: warn

      # 1️⃣1️⃣ رفع AAB
      - name: 📤 Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: kassab-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      # 1️⃣2️⃣ Release تلقائي عند عمل Tag
      - name: 🚀 Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
