name: Build Kassab APK 🎯

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK 📱
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ جلب الكود
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Java 17
      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3️⃣ Flutter SDK
      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.0'
          cache: true

      # 4️⃣ تثبيت التبعيات
      - name: 📦 Get dependencies
        run: flutter pub get

      # ✅✅ الإصلاح الجديد ✅✅
      # 5️⃣ حذف مجلد أندرويد القديم (قالبه غير مدعوم من نسخة السيرفر)
      - name: 🗑️ Remove outdated Android folder
        run: rm -rf android

      # 6️⃣ توليد مجلد أندرويد جديد مطابق لنسخة Flutter في السيرفر
      - name: 🔄 Regenerate Android project
        run: flutter create --platforms android --org com.kassab .

      # 7️⃣ بناء APK نهائي
      - name: 🏗️ Build Release APK
        run: flutter build apk --release --split-per-abi

      # 8️⃣ بناء App Bundle (لـ Play Store)
      - name: 📦 Build App Bundle (AAB)
        run: flutter build appbundle --release

      # 9️⃣ رفع ملفات APK
      - name: 📤 Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: kassab-apks
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 30
          if-no-files-found: warn

      # 🔟 رفع AAB
      - name: 📤 Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: kassab-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      # 🏷️ Release تلقائي عند عمل Tag
      - name: 🚀 Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
